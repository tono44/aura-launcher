name: Build APK

# Compila Aura en los servidores de GitHub y deja el APK como archivo descargable.
# Se lanza solo al subir cambios a main, o a mano desde la pestaña "Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para publicar el APK en "Releases"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Los runners de GitHub ya incluyen el SDK de Android: solo hay que aceptar las licencias.
      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      # El proyecto no incluye gradlew: se usa Gradle 8.9 directamente.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de depuración
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # El APK "debug" va firmado con la clave de depuración y se instala sin más por ADB.
      - uses: actions/upload-artifact@v4
        with:
          name: Aura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publica el APK en Releases con un nombre fijo, para tener un enlace de descarga estable:
      # https://github.com/USUARIO/REPOSITORIO/releases/latest/download/Aura.apk
      - name: Preparar APK para la release
        run: cp app/build/outputs/apk/debug/app-debug.apk Aura.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Aura (última compilación)
          files: Aura.apk
          make_latest: true
